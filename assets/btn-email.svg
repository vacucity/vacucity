<svg xmlns="http://www.w3.org/2000/svg" width="300" height="76" viewBox="0 0 300 76" role="img" aria-label="Email: chujie@uchicago.edu">
<title>Email: chujie@uchicago.edu</title>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
.mono{font-family:'Cascadia Code','SF Mono','JetBrains Mono',Consolas,Menlo,monospace}
.tw{animation:tw 4s ease-in-out infinite}
.t1{animation-duration:2.6s}.t2{animation-duration:3.4s}.t3{animation-duration:4.6s}.t4{animation-duration:6s}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
.float{animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sweep{animation:sweep 6s ease-in-out infinite;animation-delay:1.7s}
@keyframes sweep{0%{transform:translateX(-140px)}35%,100%{transform:translateX(440px)}}
</style>
<defs>
<filter id="bmb1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="bmb2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="bmb3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="bmb4" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="bmglow" x="-30%" y="-80%" width="160%" height="260%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="a"/>
  <feFlood flood-color="#8fd3ff" flood-opacity=".75"/>
  <feComposite in2="a" operator="in" result="g"/>
  <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="s"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bmsoft" x="-30%" y="-80%" width="160%" height="260%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="a"/>
  <feFlood flood-color="#8fd3ff" flood-opacity=".45"/>
  <feComposite in2="a" operator="in" result="g"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="bmclip"><rect width="300" height="76" rx="38"/></clipPath>
<linearGradient id="bmbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1236"/><stop offset="1" stop-color="#1a2b78"/></linearGradient>
<linearGradient id="bmedge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9a8ff" stop-opacity=".95"/><stop offset=".6" stop-color="#b9a8ff" stop-opacity=".25"/><stop offset="1" stop-color="#f6c1d9" stop-opacity=".6"/></linearGradient>
<linearGradient id="bmsw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#bmclip)">
  <rect width="300" height="76" fill="url(#bmbg)"/>
  <circle cx="40" cy="38" r="60" fill="#b9a8ff" opacity=".35" filter="url(#bmb4)"/>
  <circle cx="270" cy="76" r="50" fill="#b9a8ff" opacity=".22" filter="url(#bmb4)"/>
  <circle class="tw t1" cx="159.2" cy="2.4" r="0.44" fill="#ffffff" style="animation-delay:-0.55s"/><circle class="tw t3" cx="157.9" cy="35.6" r="1.1" fill="#dcd2ff" style="animation-delay:-1.75s"/><circle class="tw t3" cx="116.6" cy="35.8" r="0.69" fill="#e8f4ff" style="animation-delay:-0.74s"/><circle class="tw t2" cx="222.2" cy="25.7" r="0.92" fill="#ffffff" style="animation-delay:-4.48s"/><circle class="tw t1" cx="168.8" cy="3.3" r="0.65" fill="#ffffff" style="animation-delay:-1.74s"/><circle class="tw t1" cx="281.2" cy="20.5" r="0.98" fill="#c9dcff" style="animation-delay:-1.76s"/><circle class="tw t1" cx="234.4" cy="0.4" r="0.82" fill="#ffffff" style="animation-delay:-2.49s"/><circle class="tw t4" cx="106" cy="7.7" r="0.61" fill="#ffffff" style="animation-delay:-1.02s"/><circle class="tw t2" cx="247" cy="7" r="0.48" fill="#dcd2ff" style="animation-delay:-5.97s"/><circle class="tw t1" cx="248.6" cy="5.3" r="0.7" fill="#dcd2ff" style="animation-delay:-0.9s"/><circle class="tw t4" cx="133.5" cy="5.8" r="0.96" fill="#dcd2ff" style="animation-delay:-2.22s"/><circle class="tw t3" cx="168.9" cy="47.6" r="1.12" fill="#e8f4ff" style="animation-delay:-4.3s"/><circle class="tw t3" cx="283.1" cy="33.9" r="1.02" fill="#dcd2ff" style="animation-delay:-1.62s"/><circle class="tw t3" cx="222.3" cy="9.9" r="0.65" fill="#c9dcff" style="animation-delay:-0.67s"/>
  <g class="sweep"><rect x="-60" y="-20" width="70" height="116" fill="url(#bmsw)" transform="skewX(-20)"/></g>
</g>
<rect x="1" y="1" width="298" height="74" rx="37" fill="none" stroke="url(#bmedge)" stroke-width="1.6"/>
<circle cx="38" cy="38" r="22" fill="#b9a8ff" fill-opacity=".14" stroke="#b9a8ff" stroke-opacity=".7"/><g transform="translate(24.8 24.8) scale(1.1)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="2.6"/><path d="M3.5 6.5l8.5 6.4 8.5-6.4"/></g>
<text x="76" y="35" font-size="20" font-weight="600" fill="#eef4ff">Email</text>
<text class="mono" x="76" y="57" font-size="13" fill="#a8bbea">chujie@uchicago.edu</text>
<path d="M258 44l9-9m-6.5 0h6.5v6.5" fill="none" stroke="#a8bbea" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
