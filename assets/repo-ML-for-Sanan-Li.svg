<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="ML-for-Sanan-Li: Machine-learning course notebooks for the Sanan econometrics study group, one of a series with DL, RL, RAG and CS336.">
<title>ML-for-Sanan-Li: Machine-learning course notebooks for the Sanan econometrics study group, one of a series with DL, RL, RAG and CS336.</title>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
.mono{font-family:'Cascadia Code','SF Mono','JetBrains Mono',Consolas,Menlo,monospace}
.tw{animation:tw 4s ease-in-out infinite}
.t1{animation-duration:2.6s}.t2{animation-duration:3.4s}.t3{animation-duration:4.6s}.t4{animation-duration:6s}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
.float{animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.scan{animation:scan 8s ease-in-out infinite;animation-delay:-6s}
@keyframes scan{0%{transform:translateX(-200px)}50%,100%{transform:translateX(800px)}}
</style>
<defs>
<filter id="r3b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="r3b2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="r3b3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
