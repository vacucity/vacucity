<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="Group-Research: One-stop research collaboration app: turns scattered ideas into research concepts and automates literature retrieval &amp; analysis.">
