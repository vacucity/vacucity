<svg xmlns="http://www.w3.org/2000/svg" width="300" height="76" viewBox="0 0 300 76" role="img" aria-label="LinkedIn: in/vacucity">
<title>LinkedIn: in/vacucity</title>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
.mono{font-family:'Cascadia Code','SF Mono','JetBrains Mono',Consolas,Menlo,monospace}
.tw{animation:tw 4s ease-in-out infinite}
.t1{animation-duration:2.6s}.t2{animation-duration:3.4s}.t3{animation-duration:4.6s}.t4{animation-duration:6s}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
.float{animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sweep{animation:sweep 6s ease-in-out infinite;animation-delay:1.53s}
@keyframes sweep{0%{transform:translateX(-140px)}35%,100%{transform:translateX(440px)}}
</style>
<defs>
<filter id="blb1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="blb2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="blb3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blb4" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="blglow" x="-30%" y="-80%" width="160%" height="260%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="a"/>
  <feFlood flood-color="#8fd3ff" flood-opacity=".75"/>
  <feComposite in2="a" operator="in" result="g"/>
  <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="s"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="blsoft" x="-30%" y="-80%" width="160%" height="260%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="a"/>
  <feFlood flood-color="#8fd3ff" flood-opacity=".45"/>
  <feComposite in2="a" operator="in" result="g"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="blclip"><rect width="300" height="76" rx="38"/></clipPath>
<linearGradient id="blbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1236"/><stop offset="1" stop-color="#1a2b78"/></linearGradient>
<linearGradient id="bledge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a66c2" stop-opacity=".95"/><stop offset=".6" stop-color="#b9a8ff" stop-opacity=".25"/><stop offset="1" stop-color="#f6c1d9" stop-opacity=".6"/></linearGradient>
<linearGradient id="blsw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#blclip)">
  <rect width="300" height="76" fill="url(#blbg)"/>
  <circle cx="40" cy="38" r="60" fill="#0a66c2" opacity=".35" filter="url(#blb4)"/>
  <circle cx="270" cy="76" r="50" fill="#b9a8ff" opacity=".22" filter="url(#blb4)"/>
  <circle class="tw t4" cx="196.6" cy="39.8" r="0.87" fill="#e8f4ff" style="animation-delay:-0.48s"/><circle class="tw t2" cx="196.7" cy="39.8" r="0.76" fill="#dcd2ff" style="animation-delay:-2.52s"/><circle class="tw t1" cx="227.4" cy="46.2" r="0.53" fill="#c9dcff" style="animation-delay:-2.38s"/><circle class="tw t3" cx="162.9" cy="37.6" r="0.5" fill="#e8f4ff" style="animation-delay:-2.51s"/><circle class="tw t2" cx="265.7" cy="57.4" r="1.02" fill="#e8f4ff" style="animation-delay:-1.51s"/><circle class="tw t2" cx="92.4" cy="51.5" r="1.18" fill="#ffffff" style="animation-delay:-4.46s"/><circle class="tw t4" cx="156.4" cy="35.2" r="0.86" fill="#ffffff" style="animation-delay:-5.1s"/><circle class="tw t1" cx="260.5" cy="22" r="0.42" fill="#dcd2ff" style="animation-delay:-2.98s"/><circle class="tw t3" cx="195.7" cy="13.9" r="0.8" fill="#ffffff" style="animation-delay:-3.86s"/><circle class="tw t4" cx="89.9" cy="26.5" r="0.91" fill="#c9dcff" style="animation-delay:-2.8s"/><circle class="tw t2" cx="157.6" cy="1.5" r="0.99" fill="#dcd2ff" style="animation-delay:-1.8s"/><circle class="tw t1" cx="202.1" cy="19.3" r="1.07" fill="#ffffff" style="animation-delay:-3.78s"/><circle class="tw t2" cx="217.2" cy="5.1" r="0.7" fill="#dcd2ff" style="animation-delay:-5.12s"/><circle class="tw t3" cx="218.6" cy="23.9" r="1.14" fill="#c9dcff" style="animation-delay:-1.85s"/>
  <g class="sweep"><rect x="-60" y="-20" width="70" height="116" fill="url(#blsw)" transform="skewX(-20)"/></g>
</g>
<rect x="1" y="1" width="298" height="74" rx="37" fill="none" stroke="url(#bledge)" stroke-width="1.6"/>
<rect x="17" y="17" width="42" height="42" rx="10" fill="#0a66c2"/><g transform="translate(21.8 21.6) scale(1.36)" fill="#fff"><circle cx="6.4" cy="6.2" r="2.1"/><rect x="4.6" y="9.4" width="3.6" height="10" rx=".4"/><rect x="10.4" y="9.4" width="3.5" height="10" rx=".4"/><path d="M13.9 13.4c0-2.6 1.7-4.2 3.8-4.2 2.4 0 3.6 1.6 3.6 4.4v5.8h-3.6v-5.3c0-1.2-.5-1.9-1.5-1.9-1.1 0-2.3.7-2.3 2.2z"/></g>
<text x="76" y="35" font-size="20" font-weight="600" fill="#eef4ff">LinkedIn</text>
<text class="mono" x="76" y="57" font-size="13" fill="#a8bbea">in/vacucity</text>
<path d="M258 44l9-9m-6.5 0h6.5v6.5" fill="none" stroke="#a8bbea" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
