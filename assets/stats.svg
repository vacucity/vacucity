<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="GitHub stats for vacucity">
<title>GitHub stats for vacucity</title>
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
.mono{font-family:'Cascadia Code','SF Mono','JetBrains Mono',Consolas,Menlo,monospace}
.tw{animation:tw 4s ease-in-out infinite}
.t1{animation-duration:2.6s}.t2{animation-duration:3.4s}.t3{animation-duration:4.6s}.t4{animation-duration:6s}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
.float{animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<filter id="sb1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="sb2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="sb3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="sb4" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="sglow" x="-30%" y="-80%" width="160%" height="260%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="a"/>
  <feFlood flood-color="#8fd3ff" flood-opacity=".75"/>
  <feComposite in2="a" operator="in" result="g"/>
  <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="s"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="ssoft" x="-30%" y="-80%" width="160%" height="260%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="a"/>
  <feFlood flood-color="#8fd3ff" flood-opacity=".45"/>
  <feComposite in2="a" operator="in" result="g"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="sbg" x1="0" y1="0" x2=".35" y2="1">
  <stop offset="0" stop-color="#050920"/><stop offset=".55" stop-color="#0b1236"/><stop offset="1" stop-color="#16246a"/>
</linearGradient>
<linearGradient id="sedge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#8fd3ff" stop-opacity=".55"/><stop offset=".45" stop-color="#b9a8ff" stop-opacity=".12"/><stop offset="1" stop-color="#f6c1d9" stop-opacity=".45"/>
</linearGradient>
<clipPath id="sclip"><rect width="1200" height="300" rx="18"/></clipPath>
<radialGradient id="sk0"><stop offset="0" stop-color="#fff3e0" stop-opacity=".16"/><stop offset=".78" stop-color="#fff3e0" stop-opacity=".24"/><stop offset=".93" stop-color="#fff3e0" stop-opacity=".42"/><stop offset="1" stop-color="#fff3e0" stop-opacity="0"/></radialGradient><radialGradient id="sk1"><stop offset="0" stop-color="#ffe0c2" stop-opacity=".16"/><stop offset=".78" stop-color="#ffe0c2" stop-opacity=".24"/><stop offset=".93" stop-color="#ffe0c2" stop-opacity=".42"/><stop offset="1" stop-color="#ffe0c2" stop-opacity="0"/></radialGradient><radialGradient id="sk2"><stop offset="0" stop-color="#f6c1d9" stop-opacity=".16"/><stop offset=".78" stop-color="#f6c1d9" stop-opacity=".24"/><stop offset=".93" stop-color="#f6c1d9" stop-opacity=".42"/><stop offset="1" stop-color="#f6c1d9" stop-opacity="0"/></radialGradient><radialGradient id="sk3"><stop offset="0" stop-color="#d9ccff" stop-opacity=".16"/><stop offset=".78" stop-color="#d9ccff" stop-opacity=".24"/><stop offset=".93" stop-color="#d9ccff" stop-opacity=".42"/><stop offset="1" stop-color="#d9ccff" stop-opacity="0"/></radialGradient><radialGradient id="sk4"><stop offset="0" stop-color="#b9a8ff" stop-opacity=".16"/><stop offset=".78" stop-color="#b9a8ff" stop-opacity=".24"/><stop offset=".93" stop-color="#b9a8ff" stop-opacity=".42"/><stop offset="1" stop-color="#b9a8ff" stop-opacity="0"/></radialGradient><radialGradient id="sk5"><stop offset="0" stop-color="#9cc8ff" stop-opacity=".16"/><stop offset=".78" stop-color="#9cc8ff" stop-opacity=".24"/><stop offset=".93" stop-color="#9cc8ff" stop-opacity=".42"/><stop offset="1" stop-color="#9cc8ff" stop-opacity="0"/></radialGradient><radialGradient id="sk6"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".78" stop-color="#ffffff" stop-opacity=".24"/><stop offset=".93" stop-color="#ffffff" stop-opacity=".42"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<clipPath id="sbar"><rect x="652" y="124" width="500" height="14" rx="7"/></clipPath>
<linearGradient id="sv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff" stop-opacity="0"/><stop offset=".5" stop-color="#8fd3ff" stop-opacity=".35"/><stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/></linearGradient>
</defs>
